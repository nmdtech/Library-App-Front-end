<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/assets/css/bootstrap/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/theme.css">
    <title>Home Library | Login</title>
</head>
<body>

<div class="container">
    <div class="row d-flex justify-content-center align-items-center"  id="main-login">
        <div class="col-5 frame py-3">
            <div class="logo">
                <img src="/assets/images/logo-small.png" alt="" class="d-block mx-auto">
            </div>
            <form action="dashboard.html" method="post" class="py-3">
                <div class="mb-3">
                    <label for="lib_user" class="form-label">Username</label>
                    <input type="text" class="form-control" id="lib_user">
                </div>
                <div class="mb-3">
                    <label for="lib_pass" class="form-label">Password</label>
                    <input type="password" class="form-control" id="lib_pass">
                </div>
                <button type="submit" class="btn btn-theme w-100">Login</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
